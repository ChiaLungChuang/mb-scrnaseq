name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  NXF_VER: '26.10.4'
  NFT_VER: '0.9.5'

jobs:
  r-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      # The library is cached per runner image, R version, package list and
      # month: a fresh install at least monthly keeps the tests on current
      # CRAN/Bioconductor releases. Bioconductor packages build from source,
      # which is what takes 6-9 minutes.
      - name: Month (part of the R package cache key)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache R packages
        id: r-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ env.ImageOS }}-r${{ steps.setup-r.outputs.installed-r-version }}-${{ steps.month.outputs.month }}-${{ hashFiles('tests/install_r_packages.R') }}
      - name: Install R packages
        if: steps.r-cache.outputs.cache-hit != 'true'
        run: Rscript tests/install_r_packages.R
      - name: Run unit tests
        run: Rscript tests/run_tests.R

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      # test_stjude_lsf.sh runs Nextflow with a stand-in bsub to check the
      # LSF directives the St. Jude profile writes.
      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: '21'
          java-distribution: temurin
      - name: Script and test-data tests
        run: bash tests/shell/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-nextflow installs Java itself (default 17), overriding any
      # earlier setup-java step, so the Java version is set here.
      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: '21'
          java-distribution: temurin
      - name: Nextflow lint
        run: nextflow lint .
      - name: ShellCheck
        run: shellcheck -x bin/*.sh scripts/*.sh tests/shell/*.sh tests/scale/*.sh
      - name: Versions agree (manifest, R image tag and digest, git tag)
        run: bash scripts/check_versions.sh nextflow.config "$GITHUB_REF"

  pinned-r-image:
    # The cluster pulls r_container anonymously, by its digest. This job has
    # no registry login: it pulls exactly that reference, checks that the tag
    # still points to the pinned digest (a re-pushed tag fails here), and runs
    # the R unit tests inside the pinned image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull the pinned R image without logging in
        run: |
          image=$(grep -oP "^\s*r_container\s*=\s*'\K[^']+" nextflow.config)
          if [[ "$image" != *@sha256:* ]]; then
            echo "::warning::r_container (${image}) is not pinned by digest; nothing to check"
            exit 0
          fi
          docker pull "$image"
          resolved=$(docker buildx imagetools inspect "${image%@*}" | awk '/^Digest:/ { print $2; exit }')
          echo "tag ${image%@*} -> ${resolved}; pinned ${image#*@}"
          [ "$resolved" = "${image#*@}" ] \
            || { echo "::error::tag ${image%@*} now points to ${resolved}, not the pinned ${image#*@}: was it re-pushed?"; exit 1; }
          echo "PINNED_IMAGE=${image}" >> "$GITHUB_ENV"
      - name: R unit tests inside the pinned image
        if: env.PINNED_IMAGE != ''
        run: docker run --rm -v "$PWD":/w -w /w "$PINNED_IMAGE" Rscript tests/run_tests.R

  pipeline-test:
    runs-on: ubuntu-latest
    needs: [r-unit-tests, shell-tests, lint]
    steps:
      - uses: actions/checkout@v7
      # setup-nextflow installs Java itself (default 17), overriding any
      # earlier setup-java step, so the Java version is set here.
      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: '21'
          java-distribution: temurin
      - uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}
      # The pipeline tests run on the R image built from this commit (profile
      # local_r_image), so a Dockerfile change is tested before it is
      # released. The published, pinned image is checked by pinned-r-image.
      # Layers are cached in the GitHub Actions cache: when the Dockerfile and
      # its base image are unchanged, the 9-10 minute package install is
      # reused instead of rebuilt.
      - uses: docker/setup-buildx-action@v4
      - name: Build the R image from this commit
        uses: docker/build-push-action@v7
        with:
          context: containers/r-analysis
          load: true
          tags: mb-scrnaseq-r:local
          cache-from: type=gha,scope=r-image
          cache-to: type=gha,mode=max,scope=r-image
      - name: Stub run (wiring only)
        run: nextflow run . -profile test,docker,local_r_image -stub-run --outdir results_stub
      - name: Pipeline tests on the synthetic dataset
        run: nf-test test --profile +docker,local_r_image --verbose
      # The same suites on the standalone-server profile: local executor,
      # every task capped at conf/test.config's server share (2 cores, 6 GB).
      - name: Pipeline tests with the standalone-server profile
        run: nf-test test --profile +server,docker,local_r_image
      - name: The R steps ran in the image built from this commit
        run: |
          local_runs=$(grep -rls --include=.command.run 'mb-scrnaseq-r:local' .nf-test work || true)
          published=$(grep -rls --include=.command.run 'ghcr.io/chialungchuang/mb-scrnaseq-r' .nf-test work || true)
          echo "task scripts using mb-scrnaseq-r:local: $(grep -c . <<< "$local_runs" || true)"
          [ -n "$local_runs" ] || { echo "::error::no task ran in mb-scrnaseq-r:local"; exit 1; }
          [ -z "$published" ] || { echo "::error::tasks ran in the published image instead of this commit's build:"; echo "$published"; exit 1; }
      # bin/phase1_report.R on the finished synthetic runs (a passing and a
      # failing verdict), checked against each run's own outputs.
      - name: Phase 1 report on the synthetic runs' outputs
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":"$PWD" -w "$PWD" mb-scrnaseq-r:local
          Rscript tests/check_phase1_report.R .nf-test/tests/*/output

  publish-image:
    # Version tags (v0.1.0) publish the R image as ghcr.io/<owner>/mb-scrnaseq-r:0.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [pipeline-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (must be exactly what the pipeline pulls)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/mb-scrnaseq-r:${GITHUB_REF_NAME#v}"
          checked=$(bash scripts/check_versions.sh --publish nextflow.config "$GITHUB_REF")
          echo "$checked"
          expected=$(tail -n 1 <<< "$checked")
          [ "$name" = "$expected" ] || { echo "::error::would publish ${name} but the pipeline pulls ${expected}"; exit 1; }
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: containers/r-analysis
          push: true
          tags: ${{ steps.img.outputs.name }}
