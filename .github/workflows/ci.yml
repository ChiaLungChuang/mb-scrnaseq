name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  NXF_VER: '26.10.4'
  NFT_VER: '0.9.5'

jobs:
  r-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("data.table", "jsonlite", "yaml", "testthat", "withr", "BiocManager"))'
          Rscript -e 'BiocManager::install("scuttle", ask = FALSE, update = FALSE)'
      - name: Run unit tests
        run: Rscript tests/run_tests.R

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Script and test-data tests
        run: bash tests/shell/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-nextflow installs Java itself (default 17), overriding any
      # earlier setup-java step, so the Java version is set here.
      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: '21'
          java-distribution: temurin
      - name: Nextflow lint
        run: nextflow lint .
      - name: ShellCheck
        run: shellcheck -x bin/*.sh scripts/*.sh tests/shell/*.sh
      - name: Versions agree (manifest, R image tag, git tag)
        run: |
          manifest=$(grep -oP "^\s*version\s*=\s*'\K[^']+" nextflow.config)
          image_tag=$(grep -oP "r_container\s*=\s*'[^']+:\K[^']+" nextflow.config)
          echo "manifest.version=${manifest} r_container tag=${image_tag}"
          [ -n "$manifest" ] && [ "$manifest" = "$image_tag" ] \
            || { echo "::error::manifest.version (${manifest}) and the r_container tag (${image_tag}) differ"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "::error::git tag ${GITHUB_REF_NAME} does not match manifest.version ${manifest}"; exit 1
          fi

  pipeline-test:
    runs-on: ubuntu-latest
    needs: [r-unit-tests, shell-tests, lint]
    steps:
      - uses: actions/checkout@v7
      # setup-nextflow installs Java itself (default 17), overriding any
      # earlier setup-java step, so the Java version is set here.
      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}
          java-version: '21'
          java-distribution: temurin
      - uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}
      - name: Build the R image under the name the pipeline expects
        run: |
          docker build -t mb-scrnaseq-r:ci containers/r-analysis
          docker tag mb-scrnaseq-r:ci "$(grep -oP "r_container\s*=\s*'\K[^']+" nextflow.config)"
      - name: Stub run (wiring only)
        run: nextflow run . -profile test,docker -stub-run --outdir results_stub
      - name: Pipeline tests on the synthetic dataset
        run: nf-test test --profile +docker --verbose

  publish-image:
    # Version tags (v0.1.0) publish the R image as ghcr.io/<owner>/mb-scrnaseq-r:0.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [pipeline-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (must be exactly what the pipeline pulls)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/mb-scrnaseq-r:${GITHUB_REF_NAME#v}"
          expected=$(grep -oP "r_container\s*=\s*'\K[^']+" nextflow.config)
          [ "$name" = "$expected" ] || { echo "::error::would publish ${name} but the pipeline pulls ${expected}"; exit 1; }
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: containers/r-analysis
          push: true
          tags: ${{ steps.img.outputs.name }}
